# This file controls the settings for your Quarto template from www.marvinschmitt.com

# website settings
website:
  title: "Grace Wilding"                                # Your name
  image: img/headshot.jpg
  
  favicon: /img/logo.svg
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: true
    logo: /img/logo.svg
    
    # your sub-pages
    left:
      - text: "Projects"
        href: projects/index.qmd
      - text: "Education"
        href: education/index.qmd
      - text: "CV"
        href: cv/index.qmd
    
    # your social media handles
    right:
      - icon: linkedin
        href: https://www.linkedin.com/in/grace-wilding 
      - icon: envelope
        aria-label: email
        href: "mailto:gew50@case.edu"  
  
  

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox

project:
  type: website
  output-dir: docs

  preview: 
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1.1em
    theme: 
      - pulse
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true
